server:
  service:
    type: ClusterIP
  
  extraArgs:
    - --insecure

configs:
  params:
    server.insecure: true
  
  cm:
    timeout.reconciliation: 30s

controller:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

dex:
  enabled: false

redis:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

repoServer:
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
